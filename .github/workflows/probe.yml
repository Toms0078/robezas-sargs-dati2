name: Pārbaude (vienreizēja)
on: workflow_dispatch
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install requests
      - run: python probe_fdi.py
      - run: |
          git config user.name "robezas-sargs-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/probe_fdi.json && git commit -m "Pārbaude: ĀTI avoti" && git pull --rebase -q && git push
