name: Robežas sargs – pārskats (Gemini)

on:
  schedule:
    - cron: "37 4,16 * * *"   # ~07:37 un ~19:37 Rīgā (vasaras laikā), ziemā stundu agrāk
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rs-report
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Pārskats
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY || secrets.GEMINI_API }}
        run: python gemini_report.py
      - name: Saglabā
        run: |
          git config user.name "robezas-sargs-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/rs/reports.json data/rs/gemini_report.log
          if git diff --cached --quiet; then echo "Nav izmaiņu"; else
            git commit -m "Robežas sargs: pārskats $(date -u +%Y-%m-%dT%H:%MZ)"
            for i in 1 2 3; do git pull -q --rebase origin main && git push -q origin HEAD:main && break; sleep 5; done
          fi
