name: CORS pārbaude (ADS-B)
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: cors-probe
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p data/probe
          for u in "https://api.adsb.lol/v2/point/57/24/100" "https://api.airplanes.live/v2/point/57/24/100" "https://opendata.adsb.fi/api/v3/lat/57/lon/24/dist/100" "https://opendata.adsb.fi/api/v2/lat/57/lon/24/dist/100"; do
            echo "== $u"
            curl -s -o /tmp/b -D - -H "Origin: https://toms0078.github.io" -m 20 "$u" | grep -i -E '^(HTTP|access-control|content-type|x-ratelimit|retry)' || echo "nav atbildes"
            head -c 200 /tmp/b; echo
            sleep 2
          done 2>&1 | tee data/probe/cors.log
      - run: |
          git config user.name "robezas-sargs-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/probe/cors.log
          git commit -q -m "CORS pārbaude" || exit 0
          for i in 1 2 3; do git pull -q --rebase origin main && git push -q origin HEAD:main && break; sleep 5; done
