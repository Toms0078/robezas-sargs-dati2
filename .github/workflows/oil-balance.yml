name: Naftas bilance (Eurostat)

on:
  schedule:
    - cron: "37 6 * * 1"     # pirmdienās
  workflow_dispatch:
    inputs:
      test:
        description: "Testa režīms: yes/no"
        default: "no"

permissions:
  contents: write

concurrency:
  group: oil-balance
  cancel-in-progress: false

jobs:
  oil:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Naftas bilance
        run: |
          mkdir -p data/oil_balance
          python oil_balance.py ${{ inputs.test == 'yes' && '--test' || '' }} 2>&1 | tail -n 400 | tee data/oil_balance/last_run.log
      - name: Saglabā izmaiņas repozitorijā
        if: always()
        run: |
          git config user.name "robezas-sargs-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/oil_balance
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Naftas bilance: $(date -u +%Y-%m-%d)"
          for i in 1 2 3; do
            git pull --rebase -X theirs origin main && git push && exit 0
            sleep 5
          done
          exit 1
