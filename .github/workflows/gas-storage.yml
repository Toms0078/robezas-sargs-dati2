name: Gāzes krātuves (AGSI)

on:
  schedule:
    - cron: "47 18 * * *"    # AGSI publicē ~18:00–19:30 CET
    - cron: "17 6 * * *"     # rezerves palaišana no rīta
  workflow_dispatch:
    inputs:
      test:
        description: "Testa režīms: yes/no"
        default: "no"

permissions:
  contents: write

concurrency:
  group: gas-storage
  cancel-in-progress: false

jobs:
  storage:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Krātuvju aizpildījums
        env:
          AGSI_KEY: ${{ secrets.AGSI_KEY }}
        run: |
          mkdir -p data/gas_storage
          python gas_storage.py ${{ inputs.test == 'yes' && '--test' || '' }} 2>&1 | tail -n 120 | tee data/gas_storage/last_run.log
      - name: Saglabā izmaiņas repozitorijā
        if: always()
        run: |
          git config user.name "robezas-sargs-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/gas_storage
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Gāzes krātuves: $(date -u +%Y-%m-%d)"
          for i in 1 2 3; do
            git pull --rebase -X theirs origin main && git push && exit 0
            sleep 5
          done
          exit 1
