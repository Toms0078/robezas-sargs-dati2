name: Termināļi (Būtiņģe, Klaipēdas LNG)

on:
  schedule:
    - cron: "37 9 * * *"     # reizi dienā
  workflow_dispatch:
    inputs:
      test:
        description: "Testa režīms (izdrukā atbildes struktūru): yes/no"
        default: "no"

permissions:
  contents: write

concurrency:
  group: terminals
  cancel-in-progress: false

jobs:
  terminals:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Piegādes un simulācija
        env:
          GFW_TOKEN: ${{ secrets.GFW_TOKEN }}
        run: |
          set -o pipefail
          mkdir -p data/terminals
          python terminals.py ${{ inputs.test == 'yes' && '--test' || '' }} 2>&1 | tail -n 80 | tee data/terminals/last_run.log

      - name: Saglabā izmaiņas repozitorijā
        if: always()
        run: |
          git config user.name "robezas-sargs-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/terminals
          if git diff --cached --quiet; then
            echo "Nav izmaiņu"
            exit 0
          fi
          git commit -m "Termināļi: $(date -u +%Y-%m-%d)"
          for i in 1 2 3; do
            git pull --rebase -X theirs origin main && git push && exit 0
            sleep 5
          done
          exit 1
