name: Gaisa trauksmes (Gemini)

on:
  schedule:
    - cron: "23 * * * *"    # ik stundu (GitHub cron var kavēties dažas minūtes)
  workflow_dispatch:
    inputs:
      test:
        description: "Testa režīms: logā izdrukā Gemini atbildi (yes/no)"
        default: "no"

permissions:
  contents: write

concurrency:
  group: air-alerts
  cancel-in-progress: false

jobs:
  alerts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install requests

      - name: Meklē trauksmes
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY || secrets.GEMINI_KEY || secrets.GOOGLE_API_KEY || vars.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          HAS_SECRET: ${{ secrets.GEMINI_API_KEY != '' }}
          HAS_VAR: ${{ vars.GEMINI_API_KEY != '' }}
        run: |
          if [ "${{ inputs.test }}" = "yes" ]; then python air_alerts.py --test; else python air_alerts.py; fi

      - name: Saglabā izmaiņas repozitorijā
        run: |
          git config user.name "robezas-sargs-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/airalerts
          if git diff --cached --quiet; then
            echo "Nav izmaiņu"
          else
            git commit -m "Gaisa trauksmes: $(date -u +%Y-%m-%dT%H:%MZ)"
            for i in 1 2 3; do git pull -q --rebase origin main && git push -q origin HEAD:main && break; sleep 5; done
          fi
