name: VesselAPI tests

on:
  schedule:
    - cron: "23 6 * * *"     # reizi dienā (bezmaksas plāns: 150 pieprasījumi mēnesī)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: vesselapi
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 4 pieprasījumi uz VesselAPI
        env:
          VESSELAPI_KEY: ${{ secrets.VESSELAPI_KEY }}
        run: |
          set -o pipefail
          mkdir -p data/vesselapi
          python vesselapi_check.py 2>&1 | tee data/vesselapi/last_run.log

      - name: Saglabā izmaiņas repozitorijā
        if: always()
        run: |
          git config user.name "robezas-sargs-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/vesselapi
          if git diff --cached --quiet; then
            echo "Nav izmaiņu"
            exit 0
          fi
          git commit -m "VesselAPI: $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3; do
            git pull --rebase -X theirs origin main && git push && exit 0
            sleep 5
          done
          exit 1
